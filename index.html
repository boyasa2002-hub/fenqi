<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>爱心店到店寄件</title>
  <meta property="og:description" content="爱心便利商店提供社群平台上的賣家低門檻、快速、方便的開店接單方式，成交手續費0元，助攻賣家能快速投入網路平台。">
  <meta property="og:image" content="/01.jpg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/icons/icons.css">
</head>
<body data-service="kitchen">
  <header class="site-header">
    <div class="logo-slot">
      <img src="/assets/logo.png" alt="品牌 LOGO" class="site-logo">
    </div>
  </header>

  <main class="page">
    <div class="hero-stage">
      <img src="/01.jpg" alt="設計稿-01" class="hero-img" aria-hidden="true">
    </div>

    <ol class="steps" id="steps">
      <li class="active" data-step="1"><span class="step-num">1</span><span class="step-text">確認訂單</span></li>
      <li data-step="2"><span class="step-num">2</span><span class="step-text">填寫資料</span></li>
      <li data-step="3"><span class="step-num">3</span><span class="step-text">完成訂購</span></li>
      <li data-step="4"><span class="step-num">4</span><span class="step-text">訂單鎖定</span></li>
    </ol>

    <!-- Step 1 -->
    <section class="step-panel" data-step="1" id="step-1">
      <div class="panel-top">
        <img src="/02.jpg" alt="設計稿-02" class="panel-art" aria-hidden="true">
        <div class="product-card">
          <div class="product-thumb-wrap"><img src="/assets/product.png" alt="商品圖" class="product-thumb"></div>
          <div class="product-info">
            <div class="product-title" id="product-name-1">愛心店到店寄件</div>
            <div class="product-meta">編號 <span id="order-code-sample">QJD2651123625876</span></div>
            <div class="product-price"><span id="unit-price-1">NT$ 0.00</span></div>
          </div>
        </div>
      </div>

      <div class="summary-block">
        <div class="summary-row"><span>數量</span><strong>1</strong></div>
        <div class="summary-row"><span>小計</span><strong id="subtotal-1">NT$0</strong></div>
        <div class="summary-row total"><span>合計</span><strong class="total-amount" id="total-amount-1">NT $ 0.00</strong></div>
      </div>

      <div class="actions">
        <label class="agree-inline"><input type="checkbox" id="agree-terms"> 我已閱讀並同意 <a href="#" class="terms-link" data-modal="terms">《服務條款及隱私權政策》</a></label>
        <button type="button" class="btn-primary btn-block" id="btn-next-1" disabled>下一步</button>
      </div>
    </section>

    <!-- Step 2 -->
    <section class="step-panel" data-step="2" id="step-2" hidden>
      <div class="section-title">填寫資料</div>

      <div class="form-block compact">
        <label class="field-label">* 姓名</label>
        <div class="form-field-body"><input type="text" id="customer_name" required></div>
      </div>

      <div class="form-block compact">
        <label class="field-label">* 手機號碼</label>
        <div class="form-field-body"><input type="tel" id="customer_phone" required></div>
      </div>

      <div class="form-block compact">
        <label class="field-label">E-MAIL（選填）</label>
        <div class="form-field-body"><input type="email" id="customer_email"></div>
      </div>

      <!-- 門市/地址 UI 已從視圖移除以符合設計稿要求；相關 JS 邏輯已註解保留於 app.js -->

      <div class="actions">
        <button type="button" class="btn-outline btn-block" id="btn-back-2">回上一步</button>
        <button type="button" class="btn-primary btn-block" id="btn-next-2">完成訂單</button>
        <p id="message" class="error-msg"></p>
      </div>
    </section>

    <!-- Step 3 -->
    <section class="step-panel" data-step="3" id="step-3" hidden>
      <div class="completion-header small">
        <h2 class="completion-title">訂單已送出</h2>
        <p class="completion-tagline">感謝您的訂購，我們會儘速處理。</p>
      </div>

      <div class="kv-table compact">
        <div class="kv-row"><span class="kv-label">訂單編號</span><span class="kv-value" id="order-no">—</span></div>
        <div class="kv-row"><span class="kv-label">訂單時間</span><span class="kv-value" id="order-time">—</span></div>
        <div class="kv-row"><span class="kv-label">付款方式</span><span class="kv-value" id="detail-cleaning">取貨付款</span></div>
        <div class="kv-row"><span class="kv-label">訂單金額</span><span class="kv-value kv-amount" id="detail-amount">0.00</span></div>
      </div>

      <div class="actions">
        <button type="button" class="btn-outline btn-block" id="btn-back-3">回上一步</button>
        <button type="button" class="btn-primary btn-block" id="btn-submit">完成訂購</button>
      </div>
    </section>

    <!-- Step 4 -->
    <section class="step-panel" data-step="4" id="step-4" hidden>
      <div class="completion-header">
        <div class="completion-icon" aria-hidden="true">⚠</div>
        <h2 class="completion-title">訂單已被鎖定</h2>
        <p class="completion-tagline">請聯絡客服以解除鎖定</p>
      </div>

      <div class="kv-table compact">
        <div class="kv-row"><span class="kv-label">訂單編號</span><span class="kv-value" id="done-order-no">—</span></div>
        <div class="kv-row"><span class="kv-label">商品名稱</span><span class="kv-value" id="done-product">—</span></div>
        <div class="kv-row"><span class="kv-label">付款方式</span><span class="kv-value" id="done-cleaning">—</span></div>
        <div class="kv-row"><span class="kv-label">總費用</span><span class="kv-value kv-amount" id="done-amount">—</span></div>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary btn-block" id="btn-view-order">查看訂單</button>
      </div>
    </section>

    <!-- Step 5: 同頁 panel (查看訂單) -->
    <section class="step-panel" data-step="5" id="step-5" hidden>
      <div class="section-title">訂單詳情</div>
      <div class="order-detail-view">
        <div class="order-top">
          <img src="/05.jpg" alt="設計稿-05" class="order-art" aria-hidden="true">
        </div>
        <div class="kv-table compact">
          <div class="kv-row"><span class="kv-label">訂單編號</span><span class="kv-value" id="view-order-no">—</span></div>
          <div class="kv-row"><span class="kv-label">狀態</span><span class="kv-value" id="view-order-status">已鎖定</span></div>
          <div class="kv-row"><span class="kv-label">商品</span><span class="kv-value" id="view-order-product">—</span></div>
          <div class="kv-row"><span class="kv-label">總金額</span><span class="kv-value" id="view-order-amount">—</span></div>
        </div>

        <div class="actions">
          <button type="button" class="btn-outline btn-block" id="btn-close-view">返回</button>
        </div>
      </div>
    </section>

    <p class="load-error" id="load-error" hidden></p>

    <footer class="page-footer">
      <div class="footer-links">
        <a href="#" class="terms-link" data-modal="terms">服務條款</a>
        <span>|</span>
        <a href="#" class="terms-link" data-modal="policy">禁止和限制商品政策</a>
      </div>
    </footer>
  </main>

  <dialog id="text-modal" class="modal text-modal">
    <div class="modal-header">
      <h3 id="text-modal-title">服務條款</h3>
    </div>
    <div class="modal-body text-modal-body" id="text-modal-body"></div>
    <div class="modal-footer">
      <button type="button" class="btn-primary btn-block" id="text-modal-ack">我已知曉</button>
    </div>
  </dialog>

  <script src="/assets/chatwoot-token.js"></script>
  <script src="/app.js"></script>
</body>
</html>
